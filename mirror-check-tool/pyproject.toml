[project]
name = "mirror-check-tool"
version = "0.1.0"
description = "Data differences between a PostgreSQL database and its XTDB DirectMirror"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]>=3.3.4", "pydantic-settings>=2.15.0", "rich>=15.0.0"]

[project.scripts]
mirror-diff = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
target-version = ["py314"]

[tool.mypy]
strict = true
disallow_any_explicit = false
mypy_path = "src"
files = ["src", "tests"]

[dependency-groups]
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "black>=26.5.1"]
