[project]
name = "xtdb-as-postgres-mirror"
version = "0.1.0"
description = "Reproduction kit: XTDB attached to PostgreSQL 18 via logical replication and DirectMirror, with use cases that reproduce data divergences"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
]

[project.scripts]
mirror = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.black]
target-version = ["py314"]

[tool.mypy]
strict = true
disallow_any_explicit = false
mypy_path = "src"
files = ["src", "tests"]

[dependency-groups]
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "black>=26.5.1"]
